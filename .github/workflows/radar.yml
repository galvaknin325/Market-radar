name: Market Radar

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min, off-peak minutes
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: write             # lets the bot save state.json / alerts.json

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q requests yfinance

      - name: Run radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SEVERITY: ${{ vars.MIN_SEVERITY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python radar.py

      - name: Save state
        if: always()
        run: |
          git config user.name "market-radar-bot"
          git config user.email "market-radar-bot@users.noreply.github.com"
          for f in state.json alerts.json stats.json brief.json portfolio.json weekly.json archive; do
            [ -e "$f" ] && git add -A "$f"
          done
          git diff --cached --quiet || (git commit -q -m "radar: update state" && git push -q)
